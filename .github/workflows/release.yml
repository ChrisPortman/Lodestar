# Release per #35: on a `v*` tag, run CI on the tagged commit, build the
# x86_64 Linux binary on ubuntu-22.04 (glibc 2.35), and publish it with a
# SHA256 checksum. The build step is `just release`, which also runs locally.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just
      - run: just release x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Verify checksum
        working-directory: dist
        run: sha256sum -c lodestar-x86_64-unknown-linux-gnu.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Linux x86_64 binary (`lodestar-x86_64-unknown-linux-gnu`), built on Ubuntu 22.04.
          Requires glibc 2.35 or newer. Verify with `sha256sum -c lodestar-x86_64-unknown-linux-gnu.sha256`.

          The MVP has no authentication: keep it bound to loopback unless you deliberately expose it.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag \
            dist/lodestar-x86_64-unknown-linux-gnu dist/lodestar-x86_64-unknown-linux-gnu.sha256
