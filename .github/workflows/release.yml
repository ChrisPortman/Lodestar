# Release per #35: on a `v*` tag, run CI on the tagged commit, build a binary
# per target (Linux on ubuntu-22.04 for glibc 2.35, macOS on Apple Silicon and
# Intel, Windows), and publish them with SHA256 checksums. The build step is
# `just release`, which also runs locally.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Cross-compiled on the Apple Silicon runner; the Intel runners are being retired.
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just
      - run: just release ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          | Platform | Binary |
          | --- | --- |
          | Linux x86_64 (glibc 2.35 or newer) | `lodestar-x86_64-unknown-linux-gnu` |
          | macOS Apple Silicon | `lodestar-aarch64-apple-darwin` |
          | macOS Intel | `lodestar-x86_64-apple-darwin` |
          | Windows x86_64 | `lodestar-x86_64-pc-windows-msvc.exe` |

          Verify a download with `sha256sum -c <binary>.sha256` (macOS: `shasum -a 256 -c`; Windows: compare against `Get-FileHash <binary>`).
          The binaries are not code-signed: macOS Gatekeeper and Windows SmartScreen will warn on first run.

          The MVP has no authentication: keep it bound to loopback unless you deliberately expose it.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag \
            dist/*
