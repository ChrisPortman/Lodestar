[workspace]
resolver = "2"
members = ["crates/core", "crates/datarepo", "crates/api", "crates/lodestar"]

[workspace.package]
edition = "2024"
publish = false
version = "0.1.0"

[workspace.dependencies]
lodestar-core = { path = "crates/core" }
lodestar-datarepo = { path = "crates/datarepo" }
lodestar-api = { path = "crates/api" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-full", "set-header"] }
rust-embed = { version = "8", features = ["mime-guess"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2"
