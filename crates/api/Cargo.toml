[package]
name = "lodestar-api"
edition.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
lodestar-core.workspace = true
axum = { workspace = true, features = ["macros"] }
serde.workspace = true
uuid.workspace = true
chrono.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
serde_json = "1.0.154"
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid"] }
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
cookie = { version = "0.18", default-features = false }

[dev-dependencies]
tokio.workspace = true
tower.workspace = true
http-body-util.workspace = true
lodestar-core = { workspace = true, features = ["test-support"] }
lodestar-datarepo.workspace = true
tempfile = "3.27.0"
