[package]
name = "lodestar-datarepo"
edition.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:sqlx"]

[dependencies]
lodestar-core.workspace = true
sqlx = { optional = true, version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true

[dev-dependencies]
lodestar-core = { workspace = true, features = ["test-support"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = { version = "3.27.0", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
